<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Hematology 1 · Study Buddy</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #fff7fa;
        --cd: #fff;
        --pk: #ffe0ec;
        --ac: #c2457a;
        --ink: #4a3640;
        --mu: #8a7380;
        --ok: #2f8a5c;
        --no: #d6455d;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #241a20;
          --cd: #2f2229;
          --pk: #4a2c3b;
          --ac: #ff8fb7;
          --ink: #f6e8ee;
          --mu: #c4a9b6;
          --ok: #6fd1a0;
          --no: #ff8095;
        }
      }
      :root[data-theme="dark"] {
        --bg: #241a20;
        --cd: #2f2229;
        --pk: #4a2c3b;
        --ac: #ff8fb7;
        --ink: #f6e8ee;
        --mu: #c4a9b6;
        --ok: #6fd1a0;
        --no: #ff8095;
      }
      html {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          17px/1.55 Nunito,
          system-ui,
          sans-serif;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 5;
        background: var(--bg);
        padding: 10px 14px 6px;
        border-bottom: 1px solid var(--pk);
        max-width: 760px;
        margin: auto;
      }
      h1,
      h2 {
        font-family: Fredoka, Nunito, sans-serif;
        margin: 0;
        color: var(--ac);
      }
      h1 {
        font-size: 20px;
      }
      h2 {
        font-size: 26px;
        margin: 4px 0 6px;
      }
      .pb {
        height: 10px;
        background: var(--pk);
        border-radius: 9px;
        overflow: hidden;
        margin: 6px 0;
      }
      #bar {
        height: 100%;
        width: 0;
        background: var(--ac);
        border-radius: 9px;
        transition: width 0.4s;
      }
      #pc {
        font-size: 13px;
        color: var(--mu);
      }
      #nav {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding: 4px 0;
      }
      #nav button {
        flex: none;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        border: 2px solid var(--pk);
        background: var(--cd);
        font-size: 18px;
        cursor: pointer;
        position: relative;
      }
      #nav .on {
        border-color: var(--ac);
        background: var(--pk);
      }
      #nav .dn::after {
        content: "✓";
        position: absolute;
        right: -3px;
        top: -5px;
        font-size: 11px;
        color: #fff;
        background: var(--ok);
        border-radius: 50%;
        width: 15px;
        height: 15px;
        line-height: 15px;
      }
      main {
        max-width: 760px;
        margin: auto;
        padding: 12px 14px 40px;
      }
      .st {
        color: var(--mu);
        font-size: 14px;
        margin: 0;
      }
      .hint {
        color: var(--mu);
        margin: 0 0 10px;
      }
      .row button {
        font:
          600 16px Nunito,
          sans-serif;
        background: var(--ac);
        color: #fff;
        border: 0;
        border-radius: 22px;
        padding: 10px 18px;
        cursor: pointer;
      }
      :root[data-theme="dark"] .row button,
      :root:not([data-theme="light"]) .row button {
        color: #2a1420;
      }
      button.sm,
      .row button.sm {
        background: var(--pk);
        color: var(--ac);
        font:
          600 14px Nunito,
          sans-serif;
        border: 0;
        border-radius: 18px;
        padding: 7px 14px;
        cursor: pointer;
        margin-bottom: 10px;
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 18px;
      }
      .cd {
        background: var(--cd);
        border: 2px solid var(--pk);
        border-radius: 18px;
        padding: 12px 16px;
        margin-bottom: 10px;
        cursor: pointer;
      }
      .cd b {
        font-family: Fredoka, Nunito, sans-serif;
        font-weight: 500;
        font-size: 18px;
      }
      .cd b::before {
        content: "🌸 ";
      }
      .cd p {
        display: none;
        margin: 6px 0 0;
        padding-top: 6px;
        border-top: 1px dashed var(--pk);
      }
      .cd.open {
        border-color: var(--ac);
      }
      .cd.open p {
        display: block;
      }
      .cd.open b::before {
        content: "💗 ";
      }
      .cd img {
        display: block;
        max-width: 100%;
        height: auto;
        border-radius: 12px;
        margin-top: 10px;
        background: #fff;
      }
      .q {
        background: var(--cd);
        border: 2px solid var(--pk);
        border-radius: 18px;
        padding: 16px;
        margin: 10px 0;
      }
      .o {
        display: block;
        width: 100%;
        text-align: left;
        margin: 8px 0;
        padding: 11px 14px;
        border-radius: 14px;
        border: 2px solid var(--pk);
        background: var(--bg);
        color: var(--ink);
        font:
          600 16px Nunito,
          sans-serif;
        cursor: pointer;
      }
      .o.ok {
        border-color: var(--ok);
        background: var(--pk);
      }
      .o.no {
        border-color: var(--no);
      }
      .vz {
        background: var(--cd);
        border: 2px solid var(--pk);
        border-radius: 18px;
        padding: 12px 14px;
        margin: 0 0 12px;
        font-size: 15px;
      }
      .vz b {
        color: var(--ac);
      }
      .vz input {
        font:
          600 16px Nunito,
          sans-serif;
        width: 90px;
        padding: 6px 8px;
        border: 2px solid var(--pk);
        border-radius: 10px;
        background: var(--bg);
        color: var(--ink);
        margin: 4px 6px 4px 0;
      }
      .fl {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        margin-top: 6px;
      }
      .fl span {
        background: var(--pk);
        color: var(--ac);
        border-radius: 14px;
        padding: 3px 10px;
        font-size: 13px;
        font-weight: 700;
      }
      .fl span.c {
        color: #2b2b2b;
        border: 1px solid rgba(0, 0, 0, 0.15);
      }
      .dfb {
        display: flex;
        height: 22px;
        border-radius: 11px;
        overflow: hidden;
        margin: 8px 0 4px;
      }
      .hb {
        background: var(--cd);
        border: 2px solid var(--pk);
        border-radius: 20px;
        padding: 16px 18px;
        margin: 12px 0;
        cursor: pointer;
      }
      .hb:hover {
        border-color: var(--ac);
      }
      .hb b {
        display: block;
        font:
          500 20px Fredoka,
          Nunito,
          sans-serif;
        color: var(--ac);
      }
      .hb span {
        color: var(--mu);
        font-size: 15px;
      }
    </style>
  </head>

    </header>

                    ? c[2]
                        .split(",")
                        .map((k) => `<img src="${IM[k]}" alt="">`)
                        .join("")
                    : ""
                }</p></div>`,
            )
            .join(
              "",
            )}<div class="row">${cur ? `<button class="sm" onclick="go(${cur - 1})">← Back</button>` : ""}<button onclick="quiz(${cur})">Quick quiz 🌸</button>${cur < M.length - 1 ? `<button onclick="go(${cur + 1})">Next →</button>` : `<button onclick="quiz(-1)">Final quiz 🎀</button>`}</div>`;
        tp();
        if (cur == 6) cz();
      }
      function flip(j, el) {
        el.classList.toggle("open");
        seen.add(cur + "-" + j);
        tp();
      }
      function rev() {
        M[cur].c.forEach((_, j) => seen.add(cur + "-" + j));
        view();
      }
      function quiz(i) {
        hm = 0;
        const pool = i < 0 ? M.flatMap((m) => m.c) : M[i].c;
        const qs = sh(pool)
          .slice(0, i < 0 ? 20 : 6)
          .map((c) => ({
            q: c[1],
            a: c[0],
            o: sh([
              c[0],
              ...sh(pool.filter((x) => x[0] != c[0]))
                .slice(0, 3)
                .map((x) => x[0]),
            ]),
          }));
        qz = { qs, n: 0, s: 0, all: i < 0, i, p: null };
        qv();
        scrollTo(0, 0);
      }
      function qv() {
        const z = qz;
        tp();
        if (z.n >= z.qs.length) {
          const r = z.s / z.qs.length;
          $("#main").innerHTML =
            `<h2>${r > 0.8 ? "🎉" : "💪"} ${z.s} / ${z.qs.length}</h2><p>${r > 0.8 ? "Amazing! You really know this." : "Good effort! Flip through the cards again and retry."}</p><div class="row"><button onclick="quiz(${z.i})">Try again</button><button class="sm" onclick="go(${z.all ? 0 : z.i})">Back to cards</button><button class="sm" onclick="picker()">Pick another section</button>${!z.all && z.i < M.length - 1 ? `<button onclick="go(${z.i + 1})">Next topic →</button>` : ""}</div>`;
          return;
        }
        const q = z.qs[z.n];
        $("#main").innerHTML =
          `<p class="st">${z.all ? "Final quiz 🎀" : M[z.i].t} · Question ${z.n + 1} of ${z.qs.length}</p><div class="q"><b>Which term matches this?</b><p>${q.q}</p>${q.o.map((o, k) => `<button class="o ${z.p === null ? "" : o == q.a ? "ok" : k == z.p ? "no" : ""}" onclick="pick(${k})">${o}</button>`).join("")}</div>${z.p !== null ? `<div class="row"><button onclick="qz.n++;qz.p=null;qv()">${z.n + 1 < z.qs.length ? "Next →" : "See score"}</button></div>` : ""}`;
      }
      function pick(k) {
        if (qz.p !== null) return;
        qz.p = k;
        if (qz.qs[qz.n].o[k] == qz.qs[qz.n].a) qz.s++;
        qv();
      }
      function home() {
        hm = 1;
        qz = null;
        $("#main").innerHTML =
          `<div style="text-align:center;padding:4px 0 8px"><img src="${IM.hero}" alt="Cute blood cells" style="width:100%;height:auto;border-radius:20px;border:2px solid var(--pk);display:block;margin-bottom:14px"><h2 style="font-size:30px">Ready to ace Hematology?</h2><p class="hint">Pick your vibe. You can come back here anytime with 🏠</p></div><div class="hb" onclick="go(cur)"><b>📖 Let’s glow up my brain</b><span>Study first: flip the cards, see the pictures, go step by step.</span></div><div class="hb" onclick="picker()"><b>🎯 Challenge me, bestie!</b><span>Quiz time: choose the section you want to be tested on.</span></div>`;
        tp();
        scrollTo(0, 0);
      }
      function picker() {
        hm = 1;
        qz = null;
        $("#main").innerHTML =
          `<h2>🎯 Pick your battle</h2><p class="hint">Choose the section you want to be quizzed on.</p><div class="hb" onclick="quiz(-1)"><b>🎀 Everything (final boss)</b><span>20 mixed questions from all sections</span></div>${M.map((m, i) => `<div class="hb" onclick="quiz(${i})"><b>${m.e} ${m.t}</b><span>${m.c.length} cards · ${Math.min(6, m.c.length)} questions</span></div>`).join("")}<div class="row"><button class="sm" onclick="home()">← Back home</button></div>`;
        tp();
        scrollTo(0, 0);
      }
      home();
    </script>
  </body>
</html>
